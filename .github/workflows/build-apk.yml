name: Build SMOKEFREE APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          rm -rf /tmp/smokefree_build /tmp/project.b64 /tmp/project.zip
          mkdir -p /tmp/smokefree_build
          printf "%s" "" >> /tmp/project.b64
          printf "%s" "" >> /tmp/project.b64
          printf "%s" "" >> /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q -o /tmp/project.zip -d /tmp/smokefree_build
          cd /tmp/smokefree_build
          gradle assembleDebug bundleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokeFree-Debug-APK
          path: /tmp/smokefree_build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Google Play Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokeFree-GooglePlay-Release-AAB
          path: /tmp/smokefree_build/app/build/outputs/bundle/release/app-release.aab
